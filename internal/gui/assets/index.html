<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SwiftInstall</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="title">SwiftInstall</div>
          <div class="subtitle"><span id="backend">…</span><span class="dot">·</span><span id="source" class="mono">…</span></div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="search" type="text" placeholder="搜索软件…" autocomplete="off" spellcheck="false">
        </div>
        <button id="refresh" class="btn ghost" title="重新检测安装状态">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
          刷新
        </button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <label class="selectall">
          <input type="checkbox" id="selectAll">
          <span>全选</span>
        </label>
        <div class="toolbar-right">
          <button id="openSearch" class="btn ghost">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            搜索 Homebrew
          </button>
          <div class="counts" id="counts"></div>
        </div>
      </div>

      <div id="list" class="list" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        <div class="empty-glyph">◌</div>
        <div>没有匹配的软件</div>
      </div>
    </main>

    <footer class="actionbar">
      <div class="selinfo" id="selInfo">已选 <b>0</b> 项</div>
      <div class="actions">
        <button id="uninstall" class="btn subtle-danger" disabled>卸载所选</button>
        <button id="install" class="btn primary" disabled>安装所选</button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true">
      <div class="panel-head">
        <div>
          <div class="panel-title" id="progTitle">正在安装</div>
          <div class="panel-sub" id="progSub">0 / 0</div>
        </div>
        <div class="panel-badge" id="progBadge"></div>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <ul class="proglist" id="progList"></ul>
      <div class="panel-foot">
        <div id="progSummary" class="summary"></div>
        <button id="closeProgress" class="btn primary" hidden>完成</button>
      </div>
    </div>
  </div>

  <div id="searchOverlay" class="overlay" hidden>
    <div class="panel search-panel" role="dialog" aria-modal="true">
      <div class="search-head">
        <input id="searchInput" type="text" placeholder="搜索 Homebrew 仓库（formula / cask）…" autocomplete="off" spellcheck="false">
        <button id="closeSearch" class="btn ghost">关闭</button>
      </div>
      <div id="searchHint" class="search-hint">输入关键词搜索全部可用软件包，结果可添加到清单。</div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
