<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SwiftInstall</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="mast">
        <div class="wordmark">SwiftInstall</div>
        <div class="meta">
          <span id="backend" class="backend">…</span>
          <span id="source" class="source mono">…</span>
        </div>
      </div>

      <section class="block">
        <h2 class="block-h">预设</h2>
        <ul id="presetList" class="presets"></ul>
        <button id="presetSave" class="linkbtn">＋ 另存为预设</button>
      </section>

      <section class="block stats">
        <div class="stat"><span class="stat-n" id="statTotal">0</span><span class="stat-l">总数</span></div>
        <div class="stat"><span class="stat-n" id="statInstalled">–</span><span class="stat-l">已安装</span></div>
        <div class="stat"><span class="stat-n" id="statSelected">0</span><span class="stat-l">已选</span></div>
      </section>

      <div class="side-actions">
        <button id="refresh" class="sidebtn">重新检测状态</button>
      </div>
    </aside>

    <main class="main">
      <div class="bar">
        <div class="filter">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="search" type="text" placeholder="过滤当前清单…" autocomplete="off" spellcheck="false">
        </div>
        <label class="selectall">
          <input type="checkbox" id="selectAll">
          <span>全选</span>
        </label>
      </div>

      <div id="list" class="list" aria-live="polite"></div>
      <div id="repoResults" class="repo-results" hidden></div>
      <div id="empty" class="empty" hidden>
        <div>没有匹配的软件</div>
      </div>
    </main>

    <footer class="actionbar">
      <div class="selinfo" id="selInfo">已选 <b>0</b></div>
      <div class="actions">
        <button id="uninstall" class="btn danger" disabled>卸载所选</button>
        <button id="install" class="btn primary" disabled>安装所选</button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true">
      <div class="panel-head">
        <div>
          <div class="panel-title" id="progTitle">正在安装</div>
          <div class="panel-sub" id="progSub">0 / 0</div>
        </div>
        <div class="panel-badge" id="progBadge"></div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <ul class="proglist" id="progList"></ul>
      <div class="panel-foot">
        <div id="progSummary" class="summary"></div>
        <button id="closeProgress" class="btn primary" hidden>完成</button>
      </div>
    </div>
  </div>

  <div id="saveOverlay" class="overlay" hidden>
    <div class="panel save-panel" role="dialog" aria-modal="true">
      <div class="panel-title">保存为预设</div>
      <div class="search-hint" style="margin:6px 0 12px">把当前清单（含搜索添加的软件）保存为预设，随时切换加载。</div>
      <input id="saveName" type="text" placeholder="预设名称，如 work / design" autocomplete="off" spellcheck="false">
      <div class="panel-foot">
        <span id="saveError" class="summary" style="color:var(--red)"></span>
        <div class="actions">
          <button id="saveCancel" class="btn">取消</button>
          <button id="saveConfirm" class="btn primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
