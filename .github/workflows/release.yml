name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binary
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $COMMIT  = git rev-parse --short HEAD
          $DATE    = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          go build `
            -ldflags "-X main.Version=$VERSION -X main.Commit=$COMMIT -X main.Date=$DATE" `
            -o sis-windows-amd64.exe `
            ./cmd/sis/

      - name: Verify binary version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = & ./sis-windows-amd64.exe version | Out-String
          $out = $out.Trim()
          Write-Output "Binary output : $out"
          Write-Output "Expected tag  : $tag"
          if ($out -notlike "*$tag*") {
            Write-Error "Version mismatch: binary says '$out', expected to contain '$tag'"
            exit 1
          }
          Write-Output "Version verified OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sis-windows-amd64
          path: sis-windows-amd64.exe
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sis-windows-amd64
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: sis-windows-amd64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
