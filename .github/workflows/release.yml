name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        go-version: ['1.25']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Clean stale artifacts
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue sis-*, release/*

      - name: Build
        shell: pwsh
        run: |
          $VERSION = ${{ github.ref_name }}
          $COMMIT = git rev-parse --short HEAD
          $DATE = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          go build -ldflags "-X main.Version=$VERSION -X main.Commit=$COMMIT -X main.Date=$DATE" -o sis-windows-amd64.exe ./cmd/sis/

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $ver = & ./sis-windows-amd64.exe version 2>$null | Out-String | ForEach-Object { $_.Trim() }
          if ($ver -notmatch "^${{ github.ref_name }}") {
            Write-Output "Version mismatch: binary says '$ver', tag is '${{ github.ref_name }}'"
            exit 1
          }
          Write-Output "Version verified: $ver"

      - name: Test
        run: go test ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sis-windows-amd64
          path: sis-windows-amd64.exe
          retention-days: 90

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sis-windows-amd64
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          files: sis-windows-amd64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true