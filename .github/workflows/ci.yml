name: CI

# push / PR 触发：Linux 与 Windows 都跑完整的 build + vet + test + 冒烟测试。
# Windows 线不再只验证 winget 路径「能编译」，而是与 Linux 一样跑全量测试
# （含 Homebrew 后端测试 —— 所有后端跨平台可编译、不加 build tags）。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# Go 模块代理回退：优先国内镜像。
env:
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct

jobs:
  linux:
    name: Build & Test (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: go vet（静态检查门禁）
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binary
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-X main.Version=dev -X main.Commit=${COMMIT} -X main.Date=${DATE}" \
            -o sis-linux-amd64 ./cmd/sis/

      - name: Smoke test — version
        run: |
          out="$(./sis-linux-amd64 version)"
          echo "Binary output: ${out}"
          if [ -z "${out}" ]; then echo "::error::version produced no output"; exit 1; fi

      - name: Smoke test — help
        run: ./sis-linux-amd64 --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sis-linux-amd64-${{ github.sha }}
          path: sis-linux-amd64
          retention-days: 7

  windows:
    name: Build & Test (windows / winget)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: go vet（静态检查门禁）
        run: go vet ./...

      - name: Test（Windows 全量，含 Homebrew 后端）
        run: go test ./...

      - name: Build binary
        shell: pwsh
        run: |
          $COMMIT = git rev-parse --short HEAD
          $DATE   = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          go build `
            -ldflags "-X main.Version=dev -X main.Commit=$COMMIT -X main.Date=$DATE" `
            -o sis-windows-amd64.exe `
            ./cmd/sis/

      - name: Smoke test — version
        shell: pwsh
        run: |
          $out = & ./sis-windows-amd64.exe version
          Write-Output "Binary output: $out"
          if (-not $out) { Write-Error "version command produced no output"; exit 1 }

      - name: Smoke test — help
        shell: pwsh
        run: ./sis-windows-amd64.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sis-windows-amd64-${{ github.sha }}
          path: sis-windows-amd64.exe
          retention-days: 7
