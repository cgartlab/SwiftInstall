name: Feature Request｜功能请求
description: Suggest a new idea or improvement / 提出新功能或改进建议
title: "[Feature] "
labels: ["✨ type:enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request｜功能请求

        Have a suggestion for this project? / 对本项目有改进建议？

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case｜问题或使用场景
      description: Is your feature request related to a problem? Please describe. / 此请求是否关联某个问题？请描述。
      placeholder: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution｜预期解决方案
      description: Describe the solution you'd like / 描述你希望的解决方案
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered｜备选方案
      description: Describe alternatives you've considered / 描述你考虑过的备选方案

  - type: textarea
    id: context
    attributes:
      label: Additional Context｜补充信息
      description: Any other context / 其他相关信息
